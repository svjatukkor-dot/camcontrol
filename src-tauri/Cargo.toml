[package]
name = "camcontrol"
version = "1.0.0"
description = "CamControl — Програма для виявлення, перегляду та налаштування камер на ПК"
authors = ["CamControl Contributors"]
edition = "2021"

[lib]
name = "camcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10", features = ["input-native"] }
