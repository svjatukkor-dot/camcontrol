name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend-and-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies and build
        run: |
          npm ci || npm install
          npm run build

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libv4l-dev libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check and test Rust backend
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo test
