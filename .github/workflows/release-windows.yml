name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri Windows installers (NSIS EXE & MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: CamControl v__VERSION__
          releaseBody: 'Автоматична збірка інсталятора CamControl (.exe / .msi) для Windows 10 та Windows 11.'
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
